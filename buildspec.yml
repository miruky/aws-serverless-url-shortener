# Build-only compatibility entry. v2 does not execute CloudFormation from CodeBuild.
# Pause any old automatic CodePipeline before adopting this revision.
version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 24
    commands:
      - python -m pip install uv==0.11.20
      - ./dev setup
      - npx playwright install --with-deps chromium
  build:
    commands:
      - ./dev check
artifacts:
  files:
    - dist/lambda-package.zip
    - dist/product.json
    - dist/manifest.json
  discard-paths: no
