    Properties:
      RestApiId:
        Ref: RestApi
      DeploymentId:
        Ref: ApiDeployment
      StageName:
        Ref: ApiStageName
      MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
        DataTraceEnabled: false
        MetricsEnabled: true
      Tags:
      - Key: Project
        Value: url-shortener
      - Key: Component
        Value: ApiStage
    Metadata:
      com.aws.cloudformation.Context:
        why: Bound request rate and publish metrics. Execution data tracing stays
          off to avoid recording destination URLs or tokens.
        must:
        - Do not enable payload logging. API access logging requires separate review
          of account-wide API Gateway logging configuration.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Ref: ApiErrorsAlarmName
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
