        Value:
          Ref: RestApiName
      - Name: Stage
        Value:
          Ref: ApiStageName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
      - Key: Project
        Value: url-shortener
      - Key: Component
        Value: ApiErrorsAlarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Visible 5xx alarm. Notification delivery is deliberately not claimed
          until an operator attaches an existing notification destination.
        must: []
Outputs:
  ApiEndpoint:
