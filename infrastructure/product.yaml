        S3Bucket:
          Ref: LambdaS3Bucket
        S3Key:
          Ref: LambdaS3Key
      Role:
        Fn::GetAtt:
        - RedirectRole
        - Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          URLS_TABLE_NAME:
            Ref: UrlsTable
          PUBLIC_BASE_URL:
            Fn::Sub: https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}
      LoggingConfig:
        LogGroup:
          Ref: RedirectUrlLogGroup
        LogFormat: JSON
      Tags:
      - Key: Project
        Value: url-shortener
      - Key: Component
        Value: RedirectUrlFunction
    Metadata:
      com.aws.cloudformation.Context:
        why: Synchronous API integration; no asynchronous DLQ required. Tested package
          contains pinned SDK dependencies and web assets.
        must:
        - Do not expose direct invoke or Function URLs to untrusted callers.
  GetUrlStatsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Ref: GetUrlStatsFunctionName
      Runtime: python3.12
      Architectures:
      - arm64
      Handler: src.handlers.get_url_stats.handler
