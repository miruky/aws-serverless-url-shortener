    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId:
        Ref: RestApi
    Metadata:
      com.aws.cloudformation.Context:
        why: Packaging replaces this logical ID with an API-shape digest so route
          changes produce a new deployment.
        must: []
    DependsOn:
    - CreateMethod
    - ListMethod
    - StatsMethod
    - DeleteMethod
    - UpdateMethod
    - RedirectMethod
    - HeadMethod
    - AppMethod
    - AppProxyMethod
  ApiStage:
